# =============================================================================
# cai-mcp-demo — Kong declarative config (decK), synced to a DEDICATED Konnect
# control plane. No select_tags: the demo owns its control plane. Functional
# entity `tags` on the ai-mcp-proxy conversion plugins drive listener aggregation
# by config.server.tag.
#
# Phases:
#   2  two REST services, four routes, openid-connect bearer-only gates.
#   3  ai-mcp-proxy conversion-only on the REST routes + listener routes /mcp/*.
#   4+ ai-mcp-oauth2, consumers/groups, tool ACLs, token exchange, OPA (later).
#
# Issuer: openid-connect.issuer is the INTERNAL Keycloak URL and Keycloak is
# pinned to that hostname so token `iss` matches host-minted and DP-validated
# tokens alike. See NOTES.md (Phase 2).
# =============================================================================
_format_version: "3.0"

_konnect:
  control_plane_name: ${{ env "DECK_KONNECT_CONTROL_PLANE_NAME" }}

services:
  # ---------------------------------------------------------------------------
  # Dealer REST API. Each route: openid-connect gate + ai-mcp-proxy conversion-only.
  # ---------------------------------------------------------------------------
  - name: dealer-svc
    host: dealer-svc
    port: 3000
    protocol: http
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: dealer-customers
        paths: [/api/dealers/customers]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-dealer-customers
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [dealers:read]
              audience_required: [dealer-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-dealer-customers
            tags: [dealer-tools, bundle-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_dealer_customers
                  description: >-
                    List Cox Automotive dealership customers. Returns each customer's name,
                    dealership, sales region, and KBB trade-in interest. Optionally filter by region.
                  method: GET
                  path: /api/dealers/customers
                  acl:
                    allow: [dealers, ops]
                  parameters:
                    - name: region
                      in: query
                      description: "Filter by sales region: southeast, midwest, west, or northeast."
                      required: false
                      schema:
                        type: string

      - name: dealer-vehicles
        paths: [/api/dealers/vehicles]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-dealer-vehicles
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [dealers:read]
              audience_required: [dealer-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-dealer-vehicles
            tags: [dealer-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_dealer_vehicles
                  description: >-
                    List Cox Automotive dealer inventory vehicles. Returns VIN, make, model,
                    days on lot, and vAuto-style price rank. Optionally filter by price rank.
                  method: GET
                  path: /api/dealers/vehicles
                  acl:
                    allow: [dealers, ops]
                    deny: [finance]
                  parameters:
                    - name: price_rank
                      in: query
                      description: "Filter by vAuto price rank: great, good, fair, or high."
                      required: false
                      schema:
                        type: string

  # ---------------------------------------------------------------------------
  # Finance REST API.
  # ---------------------------------------------------------------------------
  - name: finance-svc
    host: finance-svc
    port: 3000
    protocol: http
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: finance-invoices
        paths: [/api/finance/invoices]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-finance-invoices
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [finance:read]
              audience_required: [finance-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-finance-invoices
            tags: [finance-tools, bundle-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_invoices
                  description: >-
                    List Cox Automotive dealer floor-plan invoices. Returns invoice id, dealer,
                    amount, and status. Optionally filter by status.
                  method: GET
                  path: /api/finance/invoices
                  acl:
                    allow: [finance, ops]
                  parameters:
                    - name: status
                      in: query
                      description: "Filter by invoice status: paid, overdue, or pending."
                      required: false
                      schema:
                        type: string

      - name: finance-floorplans
        paths: [/api/finance/floorplans]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-finance-floorplans
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [finance:read]
              audience_required: [finance-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-finance-floorplans
            tags: [finance-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_floorplans
                  description: >-
                    List Cox Automotive floor-plan lines. Returns floor-plan line, utilization,
                    and next audit date. Optionally filter by audit urgency.
                  method: GET
                  path: /api/finance/floorplans
                  acl:
                    allow: [finance]
                  parameters:
                    - name: status
                      in: query
                      description: "Filter by audit urgency: due-soon or ok."
                      required: false
                      schema:
                        type: string

  # ---------------------------------------------------------------------------
  # Remote MCP passthrough targets (Phase 5.3). Unlike the conversion services
  # above (REST→MCP), these are already-MCP servers Kong governs and PROXIES via
  # ai-mcp-proxy mode: passthrough-listener. The upstream MCP URL is the service's
  # own url (decK `url:` shorthand → protocol/host/port/path), fed from .env so the
  # remote targets are swappable. ai-mcp-oauth2 fronts both: a valid cox-auto token
  # is required to reach either remote. passthrough_credentials:false — Kong
  # terminates our auth and does NOT forward the internal token to the remote MCP.
  # ---------------------------------------------------------------------------
  - name: remote-market-mcp-service   # local Cox market-mcp — a remote we OWN
    url: ${{ env "DECK_REMOTE_MCP_URL" }}
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: mcp-remote
        paths: [/mcp/remote]
        methods: [GET, POST, DELETE]
        strip_path: true
        request_buffering: false
        response_buffering: false
        plugins:
          - name: ai-mcp-oauth2
            instance_name: mcp-oauth2-remote
            config:
              authorization_servers: [http://keycloak:8080/realms/cox-auto]
              resource: http://localhost:8000/mcp/remote
              metadata_discovery_endpoint: http://keycloak:8080/realms/cox-auto/.well-known/openid-configuration
              insecure_relaxed_audience_validation: true
              passthrough_credentials: false
              consumer_optional: true
              claim_to_header:
                - claim: sub
                  header: X-User-Id
                - claim: preferred_username
                  header: X-User-Name
          - name: ai-mcp-proxy
            instance_name: mcp-passthrough-remote
            config:
              mode: passthrough-listener
              logging:
                log_audits: true

  - name: remote-public-mcp-service   # third-party MCP we do NOT own (DeepWiki)
    url: ${{ env "DECK_REMOTE_PUBLIC_MCP_URL" }}
    connect_timeout: 10000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: mcp-remote-public
        paths: [/mcp/remote-public]
        methods: [GET, POST, DELETE]
        strip_path: true
        request_buffering: false
        response_buffering: false
        plugins:
          - name: ai-mcp-oauth2
            instance_name: mcp-oauth2-remote-public
            config:
              authorization_servers: [http://keycloak:8080/realms/cox-auto]
              resource: http://localhost:8000/mcp/remote-public
              metadata_discovery_endpoint: http://keycloak:8080/realms/cox-auto/.well-known/openid-configuration
              insecure_relaxed_audience_validation: true
              passthrough_credentials: false
              consumer_optional: true
              claim_to_header:
                - claim: sub
                  header: X-User-Id
                - claim: preferred_username
                  header: X-User-Name
          - name: ai-mcp-proxy
            instance_name: mcp-passthrough-remote-public
            config:
              mode: passthrough-listener
              logging:
                log_audits: true

# =============================================================================
# MCP listener routes (serviceless). Each aggregates the conversion-only tools
# whose plugin carries the matching entity tag (config.server.tag). Phase 4 adds
# ai-mcp-oauth2 in front of these; consumer-group ACLs live on the conversion tools.
# =============================================================================
routes:
  - name: mcp-dealers
    paths: [/mcp/dealers]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      - name: ai-mcp-oauth2
        instance_name: mcp-oauth2-dealers
        config:
          authorization_servers: [http://keycloak:8080/realms/cox-auto]
          resource: http://localhost:8000/mcp/dealers
          metadata_discovery_endpoint: http://keycloak:8080/realms/cox-auto/.well-known/openid-configuration
          # ai-mcp-oauth2 otherwise enforces RFC 8707 resource-indicator binding (token aud must
          # equal the resource URL). Our Keycloak audiences are mcp-*/dealer-api/finance-api, so we
          # relax that check at the listener and let authorization be enforced by (a) the consumer-group
          # tool ACL here and (b) the inner openid-connect gate's scope+audience on the forwarded token.
          insecure_relaxed_audience_validation: true
          # Forward the client bearer to the inner conversion route so its openid-connect gate can
          # validate scope+audience. Without this the inner gate gets no token and every tool call 401s.
          passthrough_credentials: true
          # ACL is now token-claim based (see the listener's acl_attribute_type), so consumer
          # groups are no longer mapped. consumer_claim stays optional purely for analytics
          # attribution if consumers are added later; identity is forwarded via claim_to_header.
          consumer_claim: [preferred_username]
          consumer_by: [username]
          consumer_optional: true
          claim_to_header:
            - claim: sub
              header: X-User-Id
            - claim: preferred_username
              header: X-User-Name
      - name: ai-mcp-proxy
        instance_name: mcp-listener-dealers
        config:
          mode: listener
          # aegis-style scope/claim ACL: evaluate tool allow/deny against a claim in the
          # validated OAuth access token (the `groups` claim: [dealers]|[finance]|[ops]),
          # not Kong consumer groups. acl_attribute_type/access_token_claim_field belong on
          # the listener; per-tool acl.allow/deny live on the conversion-only tools.
          acl_attribute_type: oauth_access_token
          access_token_claim_field: groups
          server:
            tag: dealer-tools
          logging:
            log_audits: true

  - name: mcp-finance
    paths: [/mcp/finance]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      - name: ai-mcp-oauth2
        instance_name: mcp-oauth2-finance
        config:
          authorization_servers: [http://keycloak:8080/realms/cox-auto]
          resource: http://localhost:8000/mcp/finance
          metadata_discovery_endpoint: http://keycloak:8080/realms/cox-auto/.well-known/openid-configuration
          # ai-mcp-oauth2 otherwise enforces RFC 8707 resource-indicator binding (token aud must
          # equal the resource URL). Our Keycloak audiences are mcp-*/dealer-api/finance-api, so we
          # relax that check at the listener and let authorization be enforced by (a) the consumer-group
          # tool ACL here and (b) the inner openid-connect gate's scope+audience on the forwarded token.
          insecure_relaxed_audience_validation: true
          # Forward the client bearer to the inner conversion route so its openid-connect gate can
          # validate scope+audience. Without this the inner gate gets no token and every tool call 401s.
          passthrough_credentials: true
          # ACL is now token-claim based (see the listener's acl_attribute_type), so consumer
          # groups are no longer mapped. consumer_claim stays optional purely for analytics
          # attribution if consumers are added later; identity is forwarded via claim_to_header.
          consumer_claim: [preferred_username]
          consumer_by: [username]
          consumer_optional: true
          claim_to_header:
            - claim: sub
              header: X-User-Id
            - claim: preferred_username
              header: X-User-Name
      - name: ai-mcp-proxy
        instance_name: mcp-listener-finance
        config:
          mode: listener
          # aegis-style scope/claim ACL: evaluate tool allow/deny against a claim in the
          # validated OAuth access token (the `groups` claim: [dealers]|[finance]|[ops]),
          # not Kong consumer groups. acl_attribute_type/access_token_claim_field belong on
          # the listener; per-tool acl.allow/deny live on the conversion-only tools.
          acl_attribute_type: oauth_access_token
          access_token_claim_field: groups
          server:
            tag: finance-tools
          logging:
            log_audits: true

  - name: mcp-ops
    paths: [/mcp/ops]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      # Phase 5: /mcp/ops is the "operations" endpoint. Unlike dealers/finance (JWKS),
      # it validates via INTROSPECTION (kong-exchange confidential client) AND performs
      # an RFC 8693 standard token exchange. This lets an mcp:use-ONLY token (which lacks
      # the dealer-api/finance-api audiences the inner OIDC gates require) still call the
      # bundled dealer+finance tools: Kong exchanges it for a token carrying both API
      # audiences+scopes, then forwards THAT to the inner conversion route. dana/olivia
      # tokens that already carry the API audiences work by direct forwarding; the exchange
      # is what makes the mcp:use-only case succeed — the story direct-forwarding can't tell.
      - name: ai-mcp-oauth2
        instance_name: mcp-oauth2-ops
        config:
          authorization_servers: [http://keycloak:8080/realms/cox-auto]
          resource: http://localhost:8000/mcp/ops
          metadata_discovery_endpoint: http://keycloak:8080/realms/cox-auto/.well-known/openid-configuration
          # Force introspection-based validation (contrast with dealers/finance JWKS). Requires
          # a confidential client; kong-exchange authenticates the introspection call. Keycloak's
          # introspection response carries the full claim set (sub/preferred_username/groups),
          # so claim_to_header + the listener's groups-claim ACL still work.
          introspection_endpoint: http://keycloak:8080/realms/cox-auto/protocol/openid-connect/token/introspect
          client_id: ${{ env "DECK_KONG_EXCHANGE_CLIENT_ID" }}
          client_secret: ${{ env "DECK_KONG_EXCHANGE_SECRET" }}
          client_auth: client_secret_post
          # ai-mcp-oauth2 otherwise enforces RFC 8707 resource-indicator binding (token aud must
          # equal the resource URL). Our Keycloak audiences are mcp-*/dealer-api/finance-api, so we
          # relax that check at the listener and let authorization be enforced by (a) the token-claim
          # tool ACL here and (b) the inner openid-connect gate's scope+audience on the EXCHANGED token.
          insecure_relaxed_audience_validation: true
          # Forward the (exchanged) bearer to the inner conversion route so its openid-connect gate
          # can validate scope+audience. With token_exchange below, the forwarded token is the
          # exchanged one carrying dealer-api/finance-api — so the inner gate passes for mcp:use tokens.
          passthrough_credentials: true
          # RFC 8693 standard token exchange (Keycloak V2). client_auth: inherit reuses the
          # introspection client (kong-exchange) creds above. We request the API SCOPES only —
          # NOT an audience. In Keycloak the token-exchange `audience` param must name a registered
          # CLIENT (dealer-api/finance-api are audience strings, not clients → "Audience not found").
          # Instead, requesting scopes dealers:read+finance:read fires those scopes' audience mappers,
          # so the exchanged token carries aud=[dealer-api,finance-api] AND retains groups=[...] for
          # the listener ACL. Verified live against Keycloak 26. See NOTES.md Phase-5.
          token_exchange:
            enabled: true
            token_endpoint: http://keycloak:8080/realms/cox-auto/protocol/openid-connect/token
            client_auth: inherit
            request:
              scopes: [dealers:read, finance:read]
          # ACL is token-claim based (see the listener's acl_attribute_type), so consumer
          # groups are no longer mapped. consumer_claim stays optional purely for analytics
          # attribution if consumers are added later; identity is forwarded via claim_to_header.
          consumer_claim: [preferred_username]
          consumer_by: [username]
          consumer_optional: true
          claim_to_header:
            - claim: sub
              header: X-User-Id
            - claim: preferred_username
              header: X-User-Name
            # Forward the caller's entitlement groups so the external OPA policy can
            # read them (X-User-Groups) without decoding the JWT itself.
            - claim: groups
              header: X-User-Groups
      # opa — EXTERNAL policy engine as an ADDITIONAL gate on /mcp/ops. Reads the
      # decoded JSON-RPC body (tool name) + X-User-Groups header and denies
      # list_invoices for non-finance/ops callers. The policy file (opa/policies/mcp.rego)
      # hot-reloads with no Kong change — the point of the OPA demo.
      - name: opa
        instance_name: opa-ops
        config:
          opa_host: opa
          opa_port: 8181
          opa_path: /v1/data/mcp/allow
          include_parsed_json_body_in_opa_input: true
      - name: ai-mcp-proxy
        instance_name: mcp-listener-ops
        config:
          mode: listener
          # aegis-style scope/claim ACL: evaluate tool allow/deny against a claim in the
          # validated OAuth access token (the `groups` claim: [dealers]|[finance]|[ops]),
          # not Kong consumer groups. acl_attribute_type/access_token_claim_field belong on
          # the listener; per-tool acl.allow/deny live on the conversion-only tools.
          acl_attribute_type: oauth_access_token
          access_token_claim_field: groups
          server:
            tag: bundle-tools
          logging:
            log_audits: true

# Tool filtering is token-claim based (ai-mcp-proxy listener acl_attribute_type:
# oauth_access_token + access_token_claim_field: groups), so there are no Kong
# consumers or consumer_groups — the `groups` claim in the validated access token
# is the ACL subject. See claude/DECISIONS.md (reverses D4).
