# =============================================================================
# cai-mcp-demo — Kong declarative config (decK), synced to a DEDICATED Konnect
# control plane. No select_tags: the demo owns its control plane. Functional
# entity `tags` on the ai-mcp-proxy conversion plugins drive listener aggregation
# by config.server.tag.
#
# Phases:
#   2  two REST services, four routes, openid-connect bearer-only gates.
#   3  ai-mcp-proxy conversion-only on the REST routes + listener routes /mcp/*.
#   4+ ai-mcp-oauth2, consumers/groups, tool ACLs, token exchange, OPA (later).
#
# Issuer: openid-connect.issuer is the INTERNAL Keycloak URL and Keycloak is
# pinned to that hostname so token `iss` matches host-minted and DP-validated
# tokens alike. See NOTES.md (Phase 2).
# =============================================================================
_format_version: "3.0"

_konnect:
  control_plane_name: ${{ env "DECK_KONNECT_CONTROL_PLANE_NAME" }}

services:
  # ---------------------------------------------------------------------------
  # Dealer REST API. Each route: openid-connect gate + ai-mcp-proxy conversion-only.
  # ---------------------------------------------------------------------------
  - name: dealer-svc
    host: dealer-svc
    port: 3000
    protocol: http
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: dealer-customers
        paths: [/api/dealers/customers]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-dealer-customers
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [dealers:read]
              audience_required: [dealer-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-dealer-customers
            tags: [dealer-tools, bundle-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_dealer_customers
                  description: >-
                    List Cox Automotive dealership customers. Returns each customer's name,
                    dealership, sales region, and KBB trade-in interest. Optionally filter by region.
                  method: GET
                  path: /api/dealers/customers
                  parameters:
                    - name: region
                      in: query
                      description: "Filter by sales region: southeast, midwest, west, or northeast."
                      required: false
                      schema:
                        type: string

      - name: dealer-vehicles
        paths: [/api/dealers/vehicles]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-dealer-vehicles
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [dealers:read]
              audience_required: [dealer-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-dealer-vehicles
            tags: [dealer-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_dealer_vehicles
                  description: >-
                    List Cox Automotive dealer inventory vehicles. Returns VIN, make, model,
                    days on lot, and vAuto-style price rank. Optionally filter by price rank.
                  method: GET
                  path: /api/dealers/vehicles
                  parameters:
                    - name: price_rank
                      in: query
                      description: "Filter by vAuto price rank: great, good, fair, or high."
                      required: false
                      schema:
                        type: string

  # ---------------------------------------------------------------------------
  # Finance REST API.
  # ---------------------------------------------------------------------------
  - name: finance-svc
    host: finance-svc
    port: 3000
    protocol: http
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: finance-invoices
        paths: [/api/finance/invoices]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-finance-invoices
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [finance:read]
              audience_required: [finance-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-finance-invoices
            tags: [finance-tools, bundle-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_invoices
                  description: >-
                    List Cox Automotive dealer floor-plan invoices. Returns invoice id, dealer,
                    amount, and status. Optionally filter by status.
                  method: GET
                  path: /api/finance/invoices
                  parameters:
                    - name: status
                      in: query
                      description: "Filter by invoice status: paid, overdue, or pending."
                      required: false
                      schema:
                        type: string

      - name: finance-floorplans
        paths: [/api/finance/floorplans]
        methods: [GET]
        strip_path: false
        plugins:
          - name: openid-connect
            instance_name: oidc-finance-floorplans
            config:
              issuer: http://keycloak:8080/realms/cox-auto
              auth_methods: [bearer]
              scopes_required: [finance:read]
              audience_required: [finance-api]
              disable_session: [bearer]
          - name: ai-mcp-proxy
            instance_name: mcp-conv-finance-floorplans
            tags: [finance-tools]
            config:
              mode: conversion-only
              logging:
                log_audits: true
              tools:
                - name: list_floorplans
                  description: >-
                    List Cox Automotive floor-plan lines. Returns floor-plan line, utilization,
                    and next audit date. Optionally filter by audit urgency.
                  method: GET
                  path: /api/finance/floorplans
                  parameters:
                    - name: status
                      in: query
                      description: "Filter by audit urgency: due-soon or ok."
                      required: false
                      schema:
                        type: string

# =============================================================================
# MCP listener routes (serviceless). Each aggregates the conversion-only tools
# whose plugin carries the matching entity tag (config.server.tag). Phase 4 adds
# ai-mcp-oauth2 in front of these; consumer-group ACLs live on the conversion tools.
# =============================================================================
routes:
  - name: mcp-dealers
    paths: [/mcp/dealers]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      - name: ai-mcp-proxy
        instance_name: mcp-listener-dealers
        config:
          mode: listener
          include_consumer_groups: true
          server:
            tag: dealer-tools
          logging:
            log_audits: true

  - name: mcp-finance
    paths: [/mcp/finance]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      - name: ai-mcp-proxy
        instance_name: mcp-listener-finance
        config:
          mode: listener
          include_consumer_groups: true
          server:
            tag: finance-tools
          logging:
            log_audits: true

  - name: mcp-ops
    paths: [/mcp/ops]
    methods: [GET, POST, DELETE]
    strip_path: false
    request_buffering: false
    response_buffering: false
    plugins:
      - name: ai-mcp-proxy
        instance_name: mcp-listener-ops
        config:
          mode: listener
          include_consumer_groups: true
          server:
            tag: bundle-tools
          logging:
            log_audits: true
